name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: npm ci
      - run: npm run typecheck && npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Prepare versioned APK
        id: version
        run: |
          TAG_NAME="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG_NAME" ]]; then
            echo "Tag and package version differ" >&2
            exit 1
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
      - name: Sign the release APK
        env:
          DEEPSHEK_SIGNING: ${{ secrets.DEEPSHEK_SIGNING }}
        run: bash scripts/sign-release.sh
      - name: Preserve the encrypted initial signing backup
        if: hashFiles('signing-backup/keystore.cms') != ''
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-signing-backup
          path: signing-backup/keystore.cms
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: deepshek-android-apk
          path: release-assets/*.apk
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Deepshek ${{ steps.version.outputs.tag }}
          files: release-assets/*.apk
          body_path: ${{ hashFiles(format('docs/release-notes/{0}.md', steps.version.outputs.tag)) != '' && format('docs/release-notes/{0}.md', steps.version.outputs.tag) || '' }}
          generate_release_notes: true
